<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2a173d">
  <title>Hecho por Anderson, para mi novia 💗</title>
  <meta name="description" content="Un jardín de flores rosadas y una carta para Alejandra.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2750%27 font-size=%2750%27%3E🌸%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#120902}
    body{
      position:fixed;inset:0;overflow:hidden;
      height:100vh;height:100dvh;
      font-family:Montserrat,sans-serif;
      -webkit-user-select:none;user-select:none;
      -webkit-tap-highlight-color:transparent;
      overscroll-behavior:none;touch-action:none
    }
    .scene{position:absolute;inset:0;overflow:hidden;z-index:1}
    .sky{
      position:absolute;inset:0;z-index:0;
      background:
        radial-gradient(circle at 50% 48%,rgba(255,163,109,.28),transparent 30%),
        linear-gradient(to bottom,#281541 0%,#562150 26%,#9f3c59 48%,#dc663f 69%,#f2a34a 86%,#ffd88a 100%)
    }
    .warm{
      position:absolute;inset:0;opacity:0;z-index:1;pointer-events:none;
      background:linear-gradient(to bottom,rgba(60,20,40,0) 28%,rgba(255,119,54,.20) 69%,rgba(255,189,106,.42) 100%)
    }
    .sun{
      position:absolute;left:50%;top:46%;width:min(31vmin,270px);aspect-ratio:1;
      transform:translate(-50%,-50%);border-radius:50%;z-index:1;
      background:radial-gradient(circle,#fff9d7 0%,#ffe47e 25%,#ffae3a 48%,rgba(255,121,55,.34) 67%,transparent 77%);
      filter:drop-shadow(0 0 26px rgba(255,177,75,.35));
      will-change:transform,opacity
    }
    .haze{
      position:absolute;left:-5%;right:-5%;top:40%;height:18%;z-index:2;pointer-events:none;
      background:linear-gradient(to bottom,transparent,rgba(255,199,135,.34),transparent);
      filter:blur(9px)
    }
    .ground{
      position:absolute;left:0;right:0;top:49%;bottom:0;z-index:2;
      background:
        linear-gradient(to right,rgba(34,65,20,.28),transparent 22%,transparent 78%,rgba(34,65,20,.28)),
        repeating-conic-gradient(at 50% -6%,transparent 0deg,transparent 2.4deg,rgba(0,0,0,.045) 2.9deg,rgba(0,0,0,.045) 3.7deg,transparent 4.2deg),
        linear-gradient(to bottom,#996025 0%,#6f3d17 15%,#45250d 39%,#281607 68%,#120902 100%);
      box-shadow:0 -10px 36px rgba(255,190,108,.34)
    }
    .ground:before{
      content:"";position:absolute;left:0;right:0;top:0;height:13%;
      background:linear-gradient(to bottom,rgba(255,205,132,.47),rgba(101,87,33,.10),transparent)
    }
    .ground:after{
      content:"";position:absolute;inset:auto -10% 0;height:66%;opacity:.82;
      background:radial-gradient(140% 90% at 50% 118%,rgba(0,0,0,.42),transparent 62%)
    }
    .field{position:absolute;inset:0;z-index:4;display:block;width:100%;height:100%}
    .vignette{
      position:absolute;inset:0;z-index:8;pointer-events:none;
      background:radial-gradient(ellipse at 50% 45%,transparent 39%,rgba(24,7,19,.58) 100%)
    }
    .letter{
      position:fixed;inset:0;z-index:20;
      display:flex;align-items:center;justify-content:center;
      opacity:0;pointer-events:none;padding:clamp(18px,5vw,56px);
      touch-action:pan-y
    }
    .letter-card{
      width:min(560px,92vw);max-height:min(86dvh,720px);overflow:auto;
      padding:clamp(1.6rem,5vw,3rem) clamp(1.4rem,5vw,2.8rem);
      text-align:center;
      background:
        radial-gradient(circle at 30% 20%,rgba(255,250,235,.075),transparent 60%),
        linear-gradient(160deg,rgba(44,24,11,.93),rgba(22,11,4,.965));
      border:1px solid rgba(255,214,140,.34);border-radius:18px;
      box-shadow:0 20px 64px rgba(0,0,0,.62),0 0 54px rgba(255,170,70,.20),inset 0 0 38px rgba(255,180,90,.07);
      backdrop-filter:blur(5px);
      transform:translateY(24px) scale(.95)
    }
    .letter-date{
      font-size:clamp(.69rem,2.6vw,.82rem);letter-spacing:.24em;padding-left:.24em;
      text-transform:uppercase;color:rgba(255,214,150,.78);margin-bottom:1rem
    }
    .letter-title{
      font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;
      font-size:clamp(2rem,7vw,3.25rem);line-height:1.08;color:#ffe9c2;
      text-shadow:0 0 26px rgba(255,180,90,.42);margin-bottom:1.3rem
    }
    .letter-body{
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(1.08rem,3.6vw,1.5rem);line-height:1.72;color:rgba(255,238,214,.93)
    }
    .letter-body p+p{margin-top:.8rem}
    .letter-sign{
      margin-top:1.65rem;font-family:"Cormorant Garamond",serif;font-style:italic;
      font-size:clamp(1rem,3.2vw,1.28rem);color:rgba(255,210,150,.83)
    }
    .walk-hint{
      position:fixed;left:50%;bottom:max(6vh,calc(env(safe-area-inset-bottom) + 38px));
      transform:translateX(-50%);z-index:18;width:min(88vw,560px);
      display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;
      transition:opacity .65s ease;pointer-events:none
    }
    .walk-text{
      font-size:clamp(.66rem,2.2vw,.82rem);letter-spacing:.15em;line-height:1.55;
      text-transform:uppercase;color:rgba(255,236,205,.86);text-shadow:0 2px 12px rgba(0,0,0,.72)
    }
    .walk-arrow{
      font-size:1.35rem;color:rgba(255,236,205,.83);
      animation:bounceDown 1.55s ease-in-out infinite
    }
    @keyframes bounceDown{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(7px);opacity:1}}
    .credit{
      position:fixed;right:max(10px,env(safe-area-inset-right));
      bottom:max(8px,env(safe-area-inset-bottom));z-index:30;
      max-width:72vw;text-align:right;color:rgba(255,220,225,.88);
      font:clamp(11px,2.6vw,14px)/1.25 Montserrat,sans-serif;
      text-shadow:0 2px 8px rgba(0,0,0,.75);pointer-events:none
    }
    @media (max-width:600px){
      .sun{top:43%;width:min(38vmin,210px)}
      .ground{top:47%}
      .letter-card{width:min(94vw,560px)}
      .credit{max-width:62vw}
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="sky"></div>
    <div class="warm" id="warm"></div>
    <div class="sun" id="sun"></div>
    <div class="haze"></div>
    <div class="ground"></div>
    <canvas class="field" id="field" aria-hidden="true"></canvas>
    <div class="vignette"></div>
  </div>

  <div class="letter" id="letter">
    <div class="letter-card">
      <p class="letter-date" id="letterDate"></p>
      <h1 class="letter-title" id="letterTitle"></h1>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-sign" id="letterSign"></p>
    </div>
  </div>

  <div class="walk-hint" id="walkHint">
    <span class="walk-text" id="walkText"></span>
    <span class="walk-arrow">⌄</span>
  </div>

  <div class="credit">Hecho por Anderson, para mi novia 💗</div>
  <script src="scene.js"></script>
</body>
</html>
