<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b123d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hecho por Anderson, para mi novia 💗</title>
  <meta name="description" content="Un jardín de flores rosadas y una carta hecha con amor.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2750%27 font-size=%2750%27%3E🌸%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#120902}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{position:fixed;inset:0;overflow:hidden;width:100%;height:100vh;height:100dvh;font-family:Montserrat,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
    .scene{position:absolute;inset:0;z-index:1;overflow:hidden;background:#160a16}
    .sky{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 46%,rgba(255,157,88,.25),transparent 28%),linear-gradient(to bottom,#251238 0%,#4a1e54 28%,#8d315c 52%,#cf5860 70%,#ed8b54 86%,#ffd17c 100%)}
    .warm{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;background:linear-gradient(to bottom,rgba(72,21,54,0) 26%,rgba(255,103,69,.18) 66%,rgba(255,184,93,.42) 100%)}
    .sun{position:absolute;z-index:1;left:50%;top:45%;width:clamp(170px,28vmin,330px);height:clamp(170px,28vmin,330px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff9d3 0%,#ffe378 25%,#ffad34 50%,rgba(255,116,51,.35) 70%,transparent 78%);filter:drop-shadow(0 0 24px rgba(255,171,65,.40));will-change:transform,opacity}
    .haze{position:absolute;left:-6%;right:-6%;top:39%;height:22%;z-index:2;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(255,194,124,.32),transparent);filter:blur(9px)}
    .ground{position:absolute;left:0;right:0;top:47%;bottom:0;z-index:2;background:repeating-conic-gradient(at 50% -3%,transparent 0deg,transparent 2.5deg,rgba(0,0,0,.055) 3deg,rgba(0,0,0,.055) 4deg,transparent 4.5deg),linear-gradient(to bottom,#a36324 0%,#734016 16%,#45250d 39%,#281507 68%,#120902 100%);box-shadow:0 -12px 42px rgba(255,187,94,.38)}
    .ground:before{content:"";position:absolute;left:0;right:0;top:0;height:10%;background:linear-gradient(to bottom,rgba(255,209,129,.50),transparent)}
    .ground:after{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:62%;background:radial-gradient(140% 82% at 50% 120%,rgba(0,0,0,.38),transparent 62%)}
    .field{position:absolute;inset:0;z-index:4;display:block;width:100%;height:100%}
    .vignette{position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 43%,rgba(28,7,22,.56) 100%)}
    .letter{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:clamp(18px,5vw,56px);opacity:0;pointer-events:none;touch-action:pan-y}
    .letter-card{width:min(560px,92vw);max-height:min(87dvh,720px);overflow:auto;padding:clamp(1.7rem,5vw,3rem) clamp(1.5rem,5vw,2.8rem);text-align:center;border-radius:18px;background:radial-gradient(circle at 30% 20%,rgba(255,250,235,.075),transparent 60%),linear-gradient(160deg,rgba(47,24,15,.94),rgba(21,9,6,.97));border:1px solid rgba(255,214,140,.34);box-shadow:0 20px 64px rgba(0,0,0,.62),0 0 56px rgba(255,160,72,.20),inset 0 0 38px rgba(255,180,90,.07);transform:translateY(24px) scale(.95)}
    .letter-date{color:rgba(255,214,150,.78);font-size:clamp(.68rem,2.7vw,.82rem);letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;margin-bottom:1rem}
    .letter-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:#ffe9c2;font-size:clamp(2rem,7vw,3.2rem);line-height:1.08;text-shadow:0 0 26px rgba(255,180,90,.42);margin-bottom:1.25rem}
    .letter-body{font-family:'Cormorant Garamond',serif;color:rgba(255,239,218,.94);font-size:clamp(1.08rem,3.7vw,1.5rem);line-height:1.7}
    .letter-body p+p{margin-top:.75rem}
    .letter-sign{margin-top:1.6rem;font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(255,211,156,.84);font-size:clamp(1rem,3.3vw,1.25rem)}
    .walk-hint{position:fixed;z-index:18;left:50%;bottom:max(6vh,calc(env(safe-area-inset-bottom) + 38px));transform:translateX(-50%);width:min(88vw,560px);display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;transition:opacity .6s ease;pointer-events:none}
    .walk-text{color:rgba(255,237,211,.88);font-size:clamp(.65rem,2.3vw,.82rem);letter-spacing:.16em;text-transform:uppercase;line-height:1.55;text-shadow:0 2px 12px rgba(0,0,0,.78)}
    .walk-arrow{color:rgba(255,238,214,.88);font-size:1.4rem;text-shadow:0 2px 10px rgba(0,0,0,.72);animation:bounce 1.55s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(7px);opacity:1}}
    .credit{position:fixed;z-index:30;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));max-width:72vw;text-align:right;color:rgba(255,224,229,.90);font:clamp(11px,2.6vw,14px)/1.3 Montserrat,Arial,sans-serif;text-shadow:0 2px 9px rgba(0,0,0,.78);pointer-events:none}
    @media(max-width:700px){.sun{top:42.5%;width:clamp(145px,42vw,215px);height:clamp(145px,42vw,215px)}.ground{top:45.5%}.haze{top:37.5%}.credit{max-width:62vw;font-size:11px}.walk-hint{bottom:max(7vh,calc(env(safe-area-inset-bottom) + 42px))}}
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="sky"></div><div class="warm" id="warm"></div><div class="sun" id="sun"></div><div class="haze"></div><div class="ground"></div><canvas class="field" id="field" aria-hidden="true"></canvas><div class="vignette"></div>
  </main>
  <section class="letter" id="letter"><div class="letter-card"><p class="letter-date" id="letterDate"></p><h1 class="letter-title" id="letterTitle"></h1><div class="letter-body" id="letterBody"></div><p class="letter-sign" id="letterSign"></p></div></section>
  <div class="walk-hint" id="walkHint"><span class="walk-text" id="walkText"></span><span class="walk-arrow">⌄</span></div>
  <div class="credit">Hecho por Anderson, para mi novia 💗</div>
  <script src="scene.js?v=20260920c"></script>
</body>
</html>
