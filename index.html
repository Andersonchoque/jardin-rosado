<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#31123f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hecho por Anderson, para mi novia 💗</title>
  <meta name="description" content="Un jardín rosado hecho con amor.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2750%27 font-size=%2750%27%3E🌸%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--vh:1vh}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#160914}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{
      position:fixed;inset:0;width:100%;
      height:100vh;height:100dvh;
      overflow:hidden;font-family:Montserrat,system-ui,sans-serif;
      -webkit-user-select:none;user-select:none;
      -webkit-tap-highlight-color:transparent;
      overscroll-behavior:none;touch-action:none
    }
    .scene{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:#1d0d1c}
    .sky{
      position:absolute;inset:0 0 53% 0;z-index:0;
      background:
        radial-gradient(circle at 50% 92%,rgba(255,103,120,.34) 0 11%,transparent 38%),
        linear-gradient(180deg,#1f0d34 0%,#3b174d 28%,#7c2858 59%,#c84c62 83%,#ef8a61 100%)
    }
    .sky:after{
      content:"";position:absolute;left:0;right:0;bottom:-1px;height:20%;
      background:linear-gradient(180deg,transparent,rgba(255,180,110,.23))
    }
    .sun{
      position:absolute;z-index:1;left:50%;top:42.7%;
      width:clamp(160px,22vw,360px);aspect-ratio:1;border-radius:50%;
      transform:translate(-50%,-50%);
      background:
        radial-gradient(circle at 50% 48%,#fff7bd 0 15%,#ffd65e 40%,#ffa12f 68%,#f36e43 100%);
      box-shadow:
        0 0 20px rgba(255,187,76,.82),
        0 0 70px rgba(255,126,64,.52),
        0 0 130px rgba(255,74,98,.27);
      will-change:transform,opacity
    }
    .horizon-glow{
      position:absolute;z-index:2;left:-10%;right:-10%;top:40%;height:12%;
      background:linear-gradient(180deg,transparent,rgba(255,181,100,.48),rgba(255,148,66,.18),transparent);
      filter:blur(6px);pointer-events:none
    }
    .ground{
      position:absolute;z-index:2;left:0;right:0;top:47%;bottom:0;
      background:
        radial-gradient(ellipse at 50% 0%,rgba(190,107,44,.55),transparent 32%),
        repeating-conic-gradient(from -10deg at 50% 0%,rgba(0,0,0,.11) 0deg,rgba(0,0,0,.11) 1deg,transparent 1.25deg,transparent 4deg),
        linear-gradient(180deg,#8c5121 0%,#643516 18%,#3d200e 43%,#251106 71%,#130805 100%);
      box-shadow:0 -12px 34px rgba(255,168,78,.28)
    }
    .ground:after{
      content:"";position:absolute;inset:0;
      background:
        linear-gradient(90deg,rgba(0,0,0,.22),transparent 22%,transparent 78%,rgba(0,0,0,.22)),
        radial-gradient(ellipse at 50% 110%,rgba(0,0,0,.40),transparent 62%);
      pointer-events:none
    }
    .field{position:absolute;inset:0;z-index:5;width:100%;height:100%;display:block}
    .vignette{
      position:absolute;inset:0;z-index:9;pointer-events:none;
      background:
        radial-gradient(ellipse at 50% 42%,transparent 49%,rgba(24,3,20,.36) 100%),
        linear-gradient(180deg,transparent 72%,rgba(7,3,5,.24) 100%)
    }
    .hint{
      position:fixed;z-index:18;left:50%;
      bottom:max(42px,calc(env(safe-area-inset-bottom) + 30px));
      transform:translateX(-50%);width:min(92vw,620px);
      text-align:center;pointer-events:none;transition:opacity .55s ease
    }
    .hint-text{
      display:block;color:rgba(255,239,216,.92);
      font-size:clamp(10px,2.7vw,13px);font-weight:500;
      text-transform:uppercase;letter-spacing:.18em;line-height:1.5;
      text-shadow:0 2px 14px rgba(0,0,0,.9)
    }
    .hint-arrow{
      display:block;margin-top:3px;color:#ffe7cf;font-size:22px;
      animation:arrow 1.45s ease-in-out infinite;
      text-shadow:0 2px 12px rgba(0,0,0,.75)
    }
    @keyframes arrow{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(7px);opacity:1}}
    .credit{
      position:fixed;z-index:25;
      right:max(10px,env(safe-area-inset-right));
      bottom:max(8px,env(safe-area-inset-bottom));
      max-width:72vw;text-align:right;pointer-events:none;
      color:rgba(255,236,236,.93);
      font:clamp(11px,2.6vw,14px)/1.3 Montserrat,sans-serif;
      text-shadow:0 2px 10px rgba(0,0,0,.92)
    }
    .letter{
      position:fixed;inset:0;z-index:22;
      display:flex;align-items:center;justify-content:center;
      padding:clamp(16px,5vw,48px);
      opacity:0;pointer-events:none;
      background:rgba(17,5,13,.16);
      backdrop-filter:blur(0px);
      transition:backdrop-filter .3s ease
    }
    .letter-card{
      width:min(560px,92vw);max-height:min(84dvh,700px);overflow:auto;
      padding:clamp(24px,6vw,48px) clamp(20px,6vw,44px);
      border-radius:22px;text-align:center;
      background:
        radial-gradient(circle at 30% 15%,rgba(255,248,228,.08),transparent 55%),
        linear-gradient(160deg,rgba(57,27,22,.94),rgba(23,10,10,.97));
      border:1px solid rgba(255,215,159,.35);
      box-shadow:0 26px 80px rgba(0,0,0,.64),0 0 46px rgba(255,131,111,.18);
      transform:translateY(26px) scale(.95)
    }
    .letter-date{
      color:#e8bc8c;text-transform:uppercase;letter-spacing:.22em;
      font-size:clamp(11px,2.8vw,13px);margin-bottom:14px
    }
    .letter-title{
      font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;
      color:#ffe8c8;font-size:clamp(32px,8vw,52px);line-height:1.04;
      margin-bottom:18px;text-shadow:0 0 26px rgba(255,175,113,.25)
    }
    .letter-body{
      font-family:"Cormorant Garamond",serif;color:#fff1df;
      font-size:clamp(18px,4.6vw,25px);line-height:1.62
    }
    .letter-body p+p{margin-top:12px}
    .letter-sign{
      margin-top:22px;font-family:"Cormorant Garamond",serif;font-style:italic;
      color:#efc79d;font-size:clamp(17px,4vw,22px)
    }

    @media (max-width:700px){
      .sky{bottom:55%}
      .ground{top:45%}
      .sun{top:40.5%;width:clamp(145px,42vw,220px)}
      .horizon-glow{top:38%}
      .credit{max-width:58vw;font-size:11px}
      .hint{bottom:max(46px,calc(env(safe-area-inset-bottom) + 34px))}
      .hint-text{letter-spacing:.13em}
    }

    @media (max-width:380px){
      .letter-card{width:94vw;padding:24px 18px}
      .credit{max-width:54vw;font-size:10px}
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="sky"></div>
    <div class="sun" id="sun"></div>
    <div class="horizon-glow"></div>
    <div class="ground"></div>
    <canvas class="field" id="field" aria-hidden="true"></canvas>
    <div class="vignette"></div>
  </main>

  <section class="letter" id="letter" aria-hidden="true">
    <div class="letter-card">
      <p class="letter-date" id="letterDate"></p>
      <h1 class="letter-title" id="letterTitle"></h1>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-sign" id="letterSign"></p>
    </div>
  </section>

  <div class="hint" id="hint">
    <span class="hint-text" id="walkText"></span>
    <span class="hint-arrow">⌄</span>
  </div>

  <div class="credit">Hecho por Anderson, para mi novia 💗</div>
  <script src="scene.js"></script>
</body>
</html>
